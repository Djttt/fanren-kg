name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# 需要仓库 Settings → Pages → Source = GitHub Actions（默认就是）
permissions:
  pages: write
  id-token: write

concurrency:
  group: github-artifacts
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve base path
        # 用户站点(user.github.io) → '/'；项目站点(user.github.io/<repo>) → '/<repo>/'
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          user="${GITHUB_REPOSITORY%/*}"
          if [ "$repo" = "$user.github.io" ]; then
            echo "VITE_BASE=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE=/$repo/" >> "$GITHUB_ENV"
          fi

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-page
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
