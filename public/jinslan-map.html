<script>
// ============ 缩放/平移 ============
(function(){
  const svg=document.getElementById('map'), W=document.getElementById('world');
  let s=1, tx=0, ty=0;
  function apply(){ W.setAttribute('transform',`translate(${tx} ${ty}) scale(${s})`); }
  function pt(e){ const r=svg.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*2076, y:(e.clientY-r.top)/r.height*1388}; }
  svg.addEventListener('wheel',e=>{
    e.preventDefault();
    const p=pt(e), f=e.deltaY<0?1.12:1/1.12, ns=Math.min(8,Math.max(.6,s*f));
    tx=p.x-(p.x-tx)*ns/s; ty=p.y-(p.y-ty)*ns/s; s=ns; apply();
  },{passive:false});
  let drag=null;
  svg.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,tx,ty};svg.classList.add('dragging')});
  window.addEventListener('mousemove',e=>{
    if(!drag)return;
    const r=svg.getBoundingClientRect(), k=2076/r.width;
    tx=drag.tx+(e.clientX-drag.x)*k; ty=drag.ty+(e.clientY-drag.y)*k; apply();
  });
  window.addEventListener('mouseup',()=>{drag=null;svg.classList.remove('dragging')});
  svg.addEventListener('dblclick',()=>{s=1;tx=0;ty=0;apply()});
})();
</script>
